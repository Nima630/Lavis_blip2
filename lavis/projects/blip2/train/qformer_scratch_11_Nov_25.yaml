model:
  # arch: blip2
  load_finetuned: false
  model_type: blip2_pretrain_qformer_n  # <- custom model file (e.g., blip2_qformer_w.py)
  load_pretrained: False
  freeze_vit: True
  vit_model: eva_clip_g
  vit_precision: fp16
  image_size: 224
  max_txt_len: 8 #32
  use_grad_checkpoint: True
  num_query_token: 32

# Custom nuscenes dataset config
datasets:
  nuscenes:
    data_type: [camera, lidar]
    vis_processor:
      train:
        name: "blip2_image_train"
        image_size: 224
    text_processor:
      train:
        name: "blip_caption"
    build_info:
      metadata_csv: /home/draiman/Desktop/Datasets_nuscenes/nuscenes_metadata.csv
      bev:
        x_min: -50.0
        x_max: 50.0
        cell_x: 0.5
        y_min: -50.0
        y_max: 50.0
        cell_y: 0.5
      cam_proj:
        camera_name: CAM_FRONT   # which camera to use when querying metadata_df
        fpn_level: 0             # matches "{token}_lvl{fpn_level}.pt"
        stride: 8                # stride used in pixel_centers() for that FPN level
      lidar_proj:
        pc_range: [-54,-54,-5,54,54,3]
      
      
      metadata_csv_train: /home/draiman/Desktop/Nima/Lavis_blip2/lavis/New_Model/data_read_nuscenes/nusc_train_metadata.csv
      metadata_csv_val: /home/draiman/Desktop/Nima/Lavis_blip2/lavis/New_Model/data_read_nuscenes/nusc_val_metadata.csv
      metadata_csv_test: /home/draiman/Desktop/Nima/Lavis_blip2/lavis/New_Model/data_read_nuscenes/nusc_val_metadata.csv  # optional
      
      annotations:
        camera:
          train:
            storage: lavis/my_datasets/nuscenes_dataset/nuscenes_camera_annotations_train.json
          val:
            storage: lavis/my_datasets/nuscenes_dataset/nuscenes_camera_annotations_val.json
          test:
            storage: lavis/my_datasets/nuscenes_dataset/nuscenes_camera_annotations_test.json
        lidar:
          train:
            storage: lavis/my_datasets/nuscenes_dataset/nuscenes_lidar_annotations_train.json
          val:
            storage: lavis/my_datasets/nuscenes_dataset/nuscenes_lidar_annotations_val.json
          test:
