run:
  retrieval_eval: false 
  task: nuscenes_captioning  # <- custom task if you register it
  lr_sched: "linear_warmup_cosine_lr" #   linear_warmup_step_lr
  # lr_decay_rate: 0.9 
  init_lr: 1e-4
  min_lr: 1e-6
  warmup_lr: 1e-6
  # lr_layer_decay: 0.9 # uncomment this which not useing linear_warmup_cosine_lr
  weight_decay: 0.05
  max_epoch: 200 #500 
  val_freq: 2 # evaluate every n epochs
  save_freq: 2 # n epochs (not used for now)
  batch_size_train:  4 #32
  batch_size_eval: 4
  num_workers: 0 #4
  accum_grad_iters: 8 # batch_size_train x accum_grad_iters = effective batch size 
  warmup_steps: 4 #50 #20 #5
  seed: 42
  # output_dir: "output/BLIP2/CAM_FRONT_Qform_mini_new_checkpointing__"
  output_dir: "output/BLIP2/CAM_FRONT_Qform_mini_new_checkpointing_with_mask"
  amp:  true
  # only uncommented when resuming traning or when evaluate only (to only evaluate, set evaluate to true)
  resume_ckpt_path: "lavis/output/BLIP2/CAM_FRONT_Qform_mini_new_checkpointing_with_mask/20251102215/checkpoint_best.pth" 
  use_shuffled_validation: false 
  evaluate: false
  train_splits: ["train"]
  valid_splits: ["val"]     
  test_splits: [] #["test"]     
  device: "cuda"
  world_size: 1 # 2 number of gpu used 
  dist_url: "env://"
  distributed: false # true
