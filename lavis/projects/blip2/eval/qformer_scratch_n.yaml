run:
  # retrieval_eval: false #true
  retrieval_eval: true
  use_shuffled_validation: false #true
  # use_batchwise_metrics: false
  task: nuscenes_captioning  # <- custom task if you register it
  lr_sched: "linear_warmup_cosine_lr" #   linear_warmup_step_lr
  # lr_decay_rate: 0.9 
  init_lr: 1e-4
  min_lr: 1e-6
  warmup_lr: 1e-6
  # lr_layer_decay: 0.9 # uncomment this which not useing linear_warmup_cosine_lr
  weight_decay: 0.05
  max_epoch: 1 #200 # 20
  val_freq: 20 # evaluate every n epochs
  save_freq: 20 # n epochs (not used for now)
  batch_size_train: 1 #64 # 16
  batch_size_eval: 1 #16 #1 #16 #64
  num_workers: 0 #4
  accum_grad_iters: 8 # batch_size_train x accum_grad_iters = effective batch size 
  warmup_steps: 4 #50 #20 #5
  seed: 42
  output_dir: "output/BLIP2_test/CAM_FRONT_Qform_mini_Adn_1_debug_1/benign"   # lidar_attacked, cam_attacked, benign
  # output_dir: "output/BLIP2_test/CAM_FRONT_Qform_mini_Adn_1_debug_1/attack"   # lidar_attacked, cam_attacked, benign
  amp:  true
  # only uncommented when resuming traning or when evaluate only (to only evaluate, set evaluate to true)
  resume_ckpt_path: "lavis/output/BLIP2/CAM_FRONT_Qform_mini_Adn_1_debug_1/20251129180/checkpoint_best.pth" 
  
  evaluate: true
  train_splits: [] #["train"]
  valid_splits: [] #["val"]     
  test_splits: ["test"]     
  device: "cuda"
  world_size: 1 # 2 number of gpu used 
  dist_url: "env://"
  distributed: false # true

















































